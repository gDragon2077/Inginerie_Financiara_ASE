name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
  refresh-pages:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const { data: site } = await github.rest.repos.getPages(context.repo);
            core.info('Pages configuration: ' + JSON.stringify({
              source: site.source,
              build_type: site.build_type ?? 'not reported'
            }));
            const { data: latest } = await github.rest.repos.getLatestPagesBuild(context.repo);
            if (latest.commit === context.sha && ['built', 'building', 'queued'].includes(latest.status)) {
              core.notice('Pages already has a build for this commit.');
              return;
            }
            await github.rest.repos.requestPagesBuild(context.repo);
            core.notice('Requested a fresh Pages build from the latest source revision.');
